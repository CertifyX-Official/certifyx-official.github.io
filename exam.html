<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertifyX | Examination Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f17; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Navbar */
        nav { border-bottom: 1px solid #1e293b; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 1100px; margin: 0 auto; padding: 0.85rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 800; background: linear-gradient(to right, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .logo span { color: #ffffff; -webkit-text-fill-color: #ffffff; }
        .timer-badge { background: #083344; border: 1px solid #06b6d4; color: #38bdf8; font-family: monospace; font-size: 1rem; font-weight: 700; padding: 0.35rem 0.85rem; border-radius: 0.5rem; }
        
        /* Main Exam Layout */
        main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; flex-grow: 1; }
        .exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #1e293b; }
        .exam-title h1 { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
        .exam-mode { font-size: 0.8rem; background: #1e293b; color: #38bdf8; padding: 0.2rem 0.5rem; border-radius: 0.25rem; }

        /* Question Box */
        .q-card { background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; border-radius: 1rem; padding: 1.75rem; margin-bottom: 1.5rem; }
        .q-number { font-size: 0.85rem; color: #06b6d4; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; }
        .q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.25rem; }
        
        /* Code Block Style */
        pre { background: #020617; border: 1px solid #1e293b; padding: 1rem; border-radius: 0.5rem; color: #38bdf8; font-family: monospace; font-size: 0.9rem; margin-bottom: 1.25rem; overflow-x: auto; }

        /* Options */
        .options-group { display: flex; flex-direction: column; gap: 0.75rem; }
        .option-lbl { display: flex; align-items: center; padding: 0.85rem 1rem; border: 1px solid #1e293b; border-radius: 0.6rem; background: #0f172a; cursor: pointer; transition: all 0.2s; }
        .option-lbl:hover { border-color: #06b6d4; background: #1e293b; }
        .option-lbl input { margin-right: 0.85rem; accent-color: #06b6d4; }

        /* Submit Button */
        .btn-submit { display: block; width: 100%; background: linear-gradient(to right, #06b6d4, #4f46e5); color: #ffffff; font-size: 1rem; font-weight: 700; padding: 1rem; border: none; border-radius: 0.75rem; cursor: pointer; text-align: center; box-shadow: 0 0 20px rgba(6, 182, 212, 0.25); margin-top: 1rem; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.95; }

        /* Result Popup / Section */
        #result-box { display: none; background: #0f172a; border: 1px solid #06b6d4; border-radius: 1rem; padding: 2.5rem; text-align: center; margin-top: 2rem; }
        .score-circle { font-size: 3rem; font-weight: 800; margin: 1rem 0; }
        .score-pass { color: #4ade80; }
        .score-fail { color: #f87171; }
        .btn-pay { display: inline-block; background: #22c55e; color: #020617; font-weight: 800; padding: 0.85rem 2rem; border-radius: 0.5rem; text-decoration: none; margin-top: 1.5rem; font-size: 1.1rem; }
        .btn-retry { display: inline-block; background: #334155; color: #ffffff; font-weight: 700; padding: 0.85rem 2rem; border-radius: 0.5rem; text-decoration: none; margin-top: 1.5rem; }

        footer { border-top: 1px solid #1e293b; background: #020617; padding: 1.5rem 0; text-align: center; color: #64748b; font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">Certify<span>X</span></a>
            <div class="timer-badge" id="timer">30:00</div>
        </div>
    </nav>

    <main>
        <div class="exam-header">
            <div class="exam-title">
                <h1 id="domain-title">Loading Exam...</h1>
                <span class="exam-mode" id="mode-title">Mode: Official</span>
            </div>
            <div style="color: #64748b; font-size: 0.9rem;">Passing Criteria: 85%+</div>
        </div>

        <form id="exam-form">
            <div id="questions-container">
                <!-- Dynamically loaded questions -->
            </div>
            <button type="button" class="btn-submit" onclick="submitExam()">Submit Assessment</button>
        </form>

        <div id="result-box">
            <h2 id="res-status">Assessment Result</h2>
            <div class="score-circle" id="res-score">0%</div>
            <p id="res-desc" style="color: #94a3b8; font-size: 1rem;"></p>

            <div id="action-area"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CertifyX Official. Secure Static Test Engine.</p>
    </footer>

    <script>
        // Sample fallback question bank for demo
        const fallbackQuestions = {
            sql: [
                { id: 1, q: "Which SQL clause is used to filter aggregated data?", opts: ["WHERE", "HAVING", "GROUP BY", "ORDER BY"], ans: 1 },
                { id: 2, q: "What will be the output of COUNT(*) on a table with 5 rows where 2 rows have NULL values?", opts: ["3", "5", "0", "NULL"], ans: 1 },
                { id: 3, q: "Which JOIN yields rows with matching keys in both tables?", code: "SELECT * FROM A INNER JOIN B ON A.id = B.id;", opts: ["LEFT JOIN", "RIGHT JOIN", "INNER JOIN", "CROSS JOIN"], ans: 2 }
            ],
            python: [
                { id: 1, q: "What is the output of type([]) in Python 3?", opts: ["<class 'tuple'>", "<class 'list'>", "<class 'dict'>", "<class 'set'>"], ans: 1 },
                { id: 2, q: "Which method adds an item to the end of a list?", opts: ["add()", "push()", "append()", "insert()"], ans: 2 }
            ],
            webdev: [
                { id: 1, q: "Which HTML tag is used to embed JavaScript code?", opts: ["<script>", "<js>", "<javascript>", "<code">], ans: 0 },
                { id: 2, q: "What does CSS stand for?", opts: ["Creative Style Sheets", "Cascading Style Sheets", "Computer Style Sheets", "Colorful Style Sheets"], ans: 1 }
            ]
        };

        const urlParams = new URLSearchParams(window.location.search);
        const domain = urlParams.get('domain') || 'sql';
        const mode = urlParams.get('mode') || 'free';

        document.getElementById('domain-title').innerText = domain.toUpperCase() + " CERTIFICATION";
        document.getElementById('mode-title').innerText = "Mode: " + mode.toUpperCase();

        const qList = fallbackQuestions[domain] || fallbackQuestions['sql'];
        const qContainer = document.getElementById('questions-container');

        // Render Questions
        qList.forEach((item, idx) => {
            let codeHtml = item.code ? `<pre><code>${item.code}</code></pre>` : '';
            let optsHtml = item.opts.map((opt, oIdx) => `
                <label class="option-lbl">
                    <input type="radio" name="q_${idx}" value="${oIdx}">
                    <span>${opt}</span>
                </label>
            `).join('');

            qContainer.innerHTML += `
                <div class="q-card">
                    <div class="q-number">Question ${idx + 1} of ${qList.length}</div>
                    <div class="q-text">${item.q}</div>
                    ${codeHtml}
                    <div class="options-group">${optsHtml}</div>
                </div>
            `;
        });

        // 30 Min Timer Logic
        let timeLeft = 30 * 60;
        const timerEl = document.getElementById('timer');
        const timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            timerEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitExam();
            }
            timeLeft--;
        }, 1000);

        // Submit & Grading Engine
        function submitExam() {
            clearInterval(timerInterval);
            let score = 0;
            qList.forEach((item, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                if (selected && parseInt(selected.value) === item.ans) {
                    score++;
                }
            });

            let percentage = Math.round((score / qList.length) * 100);

            document.getElementById('exam-form').style.display = 'none';
            const resBox = document.getElementById('result-box');
            resBox.style.display = 'block';

            const scoreEl = document.getElementById('res-score');
            scoreEl.innerText = percentage + "%";

            const actArea = document.getElementById('action-area');

            if (percentage >= 85) {
                scoreEl.className = "score-circle score-pass";
                document.getElementById('res-status').innerText = "🎉 Congratulations! You Passed.";
                document.getElementById('res-desc').innerText = `You scored ${percentage}%, meeting the 85% requirement.`;
                
                if (mode === 'official') {
                    actArea.innerHTML = `<a href="javascript:void(0)" onclick="startRazorpayPayment()" class="btn-pay">Pay ₹99 & Download Certificate</a>`;
                } else {
                    actArea.innerHTML = `<p style="color:#38bdf8; margin-top:1rem;">Practice complete! Switch to Official Exam mode to get certified.</p><a href="index.html" class="btn-retry">Back to Home</a>`;
                }
            } else {
                scoreEl.className = "score-circle score-fail";
                document.getElementById('res-status').innerText = "Assessment Failed";
                document.getElementById('res-desc').innerText = `You scored ${percentage}%. You need at least 85% to pass.`;
                actArea.innerHTML = `<a href="exam.html?domain=${domain}&mode=${mode}" class="btn-retry">Try Again Immediately</a>`;
            }
        }

        function startRazorpayPayment() {
            alert("Razorpay Payment Gateway will launch here for ₹99 INR. Upon success, your certificate will be generated instantly!");
        }
    </script>
</body>
</html>
